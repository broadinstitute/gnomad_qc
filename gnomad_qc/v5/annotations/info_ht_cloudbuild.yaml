# Build the v5 info HT deps image (info_ht.Dockerfile, beside this file) with the
# repo root as context, remotely on Cloud Build so no local docker/podman is needed.
# This config does not sit at the repo root, so --config has to be passed explicitly.
# The trailing "." is the build context and must stay the repo root -- requirements.txt
# lives there. _TAG has no default on purpose: forgetting it should fail the build
# rather than push over a shared tag. From the repo root:
#
#   gcloud builds submit \
#   --project broad-mpg-gnomad \
#   --config gnomad_qc/v5/annotations/info_ht_cloudbuild.yaml \
#   --substitutions _TAG=us-central1-docker.pkg.dev/broad-mpg-gnomad/images/gnomad-qc-deps:YYYYMMDD \
#   .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-f', 'gnomad_qc/v5/annotations/info_ht.Dockerfile', '-t', '${_TAG}', '.']
images: ['${_TAG}']
timeout: 2400s
